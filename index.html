<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID Converter Pro</title>
    <!-- Modern premium font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <header>
                <div class="brand">
                    <div class="logo-box"></div>
                    <div>
                        <h1>NID Studio</h1>
                        <p id="size-info">Pro A4 Conversion</p>
                    </div>
                </div>
                <div class="header-actions" id="action-panel" style="display: none;">
                    <button id="download-btn" class="header-dl-btn" title="Download A4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Save
                    </button>
                </div>
            </header>

            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>Upload NID PDF</p>
                    <span>Drag & drop or click</span>
                </div>
                <input type="file" id="file-input" accept="application/pdf" hidden>
            </div>

            <div class="processing-status" id="status-container" style="display: none;">
                <div class="loader"></div>
                <p id="status-text">Processing your document...</p>
            </div>

            <div class="controls-panel" id="controls-panel" style="display: none;">
                <div class="card-controls">
                    <div class="controls-header">
                        <div class="indicator blue"></div>
                        <h3>Front Image</h3>
                    </div>
                    
                    <div class="gamepad-container">
                        <!-- Position D-Pad -->
                        <div class="d-pad-section">
                            <span class="pad-label">Position</span>
                            <div class="d-pad">
                                <button class="d-btn up" onpointerdown="startAdjusting('front-y', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Up">▲</button>
                                <button class="d-btn left" onpointerdown="startAdjusting('front-x', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Left">◄</button>
                                <div class="d-btn center"></div>
                                <button class="d-btn right" onpointerdown="startAdjusting('front-x', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Right">►</button>
                                <button class="d-btn down" onpointerdown="startAdjusting('front-y', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Down">▼</button>
                            </div>
                        </div>

                        <!-- Size Controls -->
                        <div class="size-section">
                            <div class="size-group">
                                <span>Width</span>
                                <div class="btn-group">
                                    <button class="s-btn" onpointerdown="startAdjusting('front-w', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">-</button>
                                    <button class="s-btn" onpointerdown="startAdjusting('front-w', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">+</button>
                                </div>
                            </div>
                            <div class="size-group">
                                <span>Height</span>
                                <div class="btn-group">
                                    <button class="s-btn" onpointerdown="startAdjusting('front-h', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">-</button>
                                    <button class="s-btn" onpointerdown="startAdjusting('front-h', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="compact-inputs">
                        <label>X: <input type="number" id="front-x" value="8.5" step="0.1"></label>
                        <label>Y: <input type="number" id="front-y" value="3.5" step="0.1"></label>
                        <label>W: <input type="number" id="front-w" value="40.5" step="0.1"></label>
                        <label>H: <input type="number" id="front-h" value="24" step="0.1"></label>
                    </div>
                </div>

                <div class="card-controls">
                    <div class="controls-header">
                        <div class="indicator purple"></div>
                        <h3>Back Image</h3>
                    </div>
                    
                    <div class="gamepad-container">
                        <!-- Position D-Pad -->
                        <div class="d-pad-section">
                            <span class="pad-label">Position</span>
                            <div class="d-pad">
                                <button class="d-btn up" onpointerdown="startAdjusting('back-y', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Up">▲</button>
                                <button class="d-btn left" onpointerdown="startAdjusting('back-x', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Left">◄</button>
                                <div class="d-btn center"></div>
                                <button class="d-btn right" onpointerdown="startAdjusting('back-x', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Right">►</button>
                                <button class="d-btn down" onpointerdown="startAdjusting('back-y', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()" title="Move Down">▼</button>
                            </div>
                        </div>

                        <!-- Size Controls -->
                        <div class="size-section">
                            <div class="size-group">
                                <span>Width</span>
                                <div class="btn-group">
                                    <button class="s-btn" onpointerdown="startAdjusting('back-w', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">-</button>
                                    <button class="s-btn" onpointerdown="startAdjusting('back-w', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">+</button>
                                </div>
                            </div>
                            <div class="size-group">
                                <span>Height</span>
                                <div class="btn-group">
                                    <button class="s-btn" onpointerdown="startAdjusting('back-h', -0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">-</button>
                                    <button class="s-btn" onpointerdown="startAdjusting('back-h', 0.1)" onpointerup="stopAdjusting()" onpointerleave="stopAdjusting()">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="compact-inputs">
                        <label>X: <input type="number" id="back-x" value="49" step="0.1"></label>
                        <label>Y: <input type="number" id="back-y" value="3.5" step="0.1"></label>
                        <label>W: <input type="number" id="back-w" value="41.5" step="0.1"></label>
                        <label>H: <input type="number" id="back-h" value="24" step="0.1"></label>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Main Preview Area -->
        <main class="preview-area">
            <div class="empty-state" id="empty-state">
                <div class="empty-content">
                    <svg class="preview-icon" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <h2>Live Preview</h2>
                    <p>Upload a PDF to start fine-tuning.</p>
                </div>
            </div>
            
            <div class="preview-container" id="preview-container" style="display: none;">
                <div class="canvas-wrapper">
                    <canvas id="preview-canvas"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden canvas for actual high-res rendering -->
    <canvas id="render-canvas" style="display: none;"></canvas>

    <script src="main.js"></script>
</body>
</html>
